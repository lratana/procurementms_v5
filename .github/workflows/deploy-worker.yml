name: Deploy ProcurementMS Worker (controlled production release)

on:
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: "Confirm production deployment (only after API migration and testing are complete)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: procurementms-worker-production
  cancel-in-progress: false

jobs:
  validate:
    name: Install and typecheck Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --include=optional
      - name: Typecheck Worker
        run: npm run typecheck

  deploy:
    name: Deploy production Worker
    needs: validate
    if: ${{ inputs.deploy_to_production == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --include=optional
      - name: Deploy production Worker
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
