[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "/api"

# Environment-specific Netlify contexts
# Override VITE_API_BASE_URL in Netlify Site Settings per deploy context if using separate Worker hosts,
# or keep "/api" when using same-origin proxy / Cloudflare Worker route.
[context.production.environment]
  VITE_API_BASE_URL = "/api"

[context.deploy-preview.environment]
  VITE_API_BASE_URL = "/api"

[context.branch-deploy.environment]
  VITE_API_BASE_URL = "/api"
